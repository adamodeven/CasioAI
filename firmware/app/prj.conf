# CasioAI watch firmware — nRF Connect SDK / Zephyr project configuration.
# Built and reasoned about without access to the actual SDK/toolchain in
# this environment — see ../README.md "known risk areas" before trusting
# any of these Kconfig symbol names against your installed NCS version.

# --- Bluetooth: peripheral role only, one central (the phone) at a time ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CasioAI Watch"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_GATT_DYNAMIC_DB=n

# Just-Works pairing: keeps casual BLE clients from issuing call/music
# commands without requiring the user to enter a passkey on a device with
# no full keyboard.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# --- Peripherals ---
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_NRFX_PDM=y
CONFIG_NRFX_PDM0=y

# --- Power management: idle aggressively between BLE/GPIO events ---
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# --- Misc ---
# power.c uses <time.h> gmtime_r() for the Unix-seconds -> H:M breakdown;
# needs a C library that provides it. Newlib is the safe, widely-supported
# choice — picolibc (Zephyr's newer default) also supports it if your NCS
# version prefers that instead.
CONFIG_NEWLIB_LIBC=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
